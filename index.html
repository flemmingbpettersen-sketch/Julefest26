<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12372a">

  <title>Julefest 2026 🎄</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0b241b, #12372a);
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 22px 18px 40px;
    }

    .hero {
      text-align: center;
      padding: 35px 10px 25px;
    }

    .tree {
      font-size: 58px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      color: #f4d06f;
    }

    .date {
      margin-top: 10px;
      font-size: 17px;
    }

    .countdown-title {
      margin-top: 30px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f4d06f;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .countdown-box {
      width: 72px;
      padding: 12px 5px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(244,208,111,0.35);
      border-radius: 14px;
    }

    .number {
      font-size: 25px;
      font-weight: 700;
    }

    .label {
      margin-top: 3px;
      font-size: 10px;
      text-transform: uppercase;
      color: #d5d5d5;
    }

    .section-title {
      margin: 22px 4px 10px;
      font-size: 14px;
      color: #f4d06f;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      padding: 20px 12px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .card:active {
      transform: scale(0.97);
    }

    .wide-card {
      grid-column: span 2;
    }

    .status-card {
      background: linear-gradient(135deg, #155d46, #1f7a5c);
    }

    .wheel-card {
      background: linear-gradient(135deg, #9d1b24, #c32f3c);
    }

    .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
    }

    .card-text {
      margin-top: 4px;
      font-size: 11px;
      color: #cfcfcf;
    }

    .content-box {
      display: none;
      margin-top: 15px;
      padding: 18px;
      background: rgba(0,0,0,0.22);
      border-radius: 18px;
    }

    .content-box.active {
      display: block;
    }

    .content-box h2 {
      margin-top: 0;
      color: #f4d06f;
    }

    .person,
    .score-row,
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .person {
      justify-content: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #9d1b24;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-value,
    .status-value {
      color: #f4d06f;
      font-weight: 600;
      text-align: right;
    }

    .status-value {
      font-size: 13px;
    }

    select {
      width: 100%;
      margin: 6px 0 10px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #12372a;
      font-size: 16px;
    }

    .select-label {
      display: block;
      margin-top: 12px;
      color: #f4d06f;
      font-size: 13px;
      font-weight: 600;
    }

    .game-button {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #f4d06f;
      color: #12372a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .game-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .red-button {
      background: #c32f3c;
      color: white;
    }

    .status-message,
    .photo-message {
      min-height: 25px;
      margin-top: 12px;
      text-align: center;
      color: #f4d06f;
      font-weight: 600;
    }

    #wheelResult {
      min-height: 40px;
      margin-top: 18px;
      text-align: center;
      color: #f4d06f;
      font-size: 20px;
      font-weight: 700;
    }

    .dice-area,
    .timer-area,
    .upload-area {
      margin-top: 18px;
      padding: 20px;
      background: rgba(255,255,255,0.07);
      border-radius: 18px;
      text-align: center;
    }

    #dice {
      margin: 10px 0;
      font-size: 78px;
    }

    #diceResult {
      min-height: 45px;
      margin-top: 15px;
      color: #f4d06f;
      font-weight: 600;
    }

    #packageTimer {
      margin: 10px 0;
      color: #f4d06f;
      font-size: 42px;
      font-weight: 700;
    }

    .rule {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .photo-count {
      color: #f4d06f;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .photo-help {
      font-size: 12px;
      color: #cfcfcf;
      line-height: 1.5;
    }

    .photo-input {
      display: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty-gallery {
      grid-column: span 2;
      text-align: center;
      color: #cfcfcf;
      padding: 24px 0;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(0,0,0,0.92);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal img {
      max-width: 100%;
      max-height: 86vh;
      border-radius: 14px;
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 20px;
      background: white;
      color: #12372a;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    footer {
      margin-top: 35px;
      text-align: center;
      font-size: 12px;
      color: #aeb8b2;
    }

  </style>
</head>

<body>

<div class="app">

  <div class="hero">

    <div class="tree">🎄</div>

    <h1>Julefest 2026</h1
